<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utkarsh Shukla | Content Strategist</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <style>
        /* === BASE & RESET === */
        :root {
            --bg: #03050a; 
            --text: #f0f0f0;
            --accent: #00e5ff; /* Cyan Blue */
            --glass: rgba(0, 229, 255, 0.03);
            --border: rgba(0, 229, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        ::selection { background: var(--accent); color: #000; }

        /* Disable ugly blue highlighting on text */
        .welcome-text, .text-utkarsh, .text-shukla, .hero-subtitle-badge, .float-icon {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        /* Cinematic Noise Overlay */
        .noise-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 9998; opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Ambient Smoke Effect */
        #smoke-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0; pointer-events: none; opacity: 0.5;
        }

        /* Balanced Water-Wave Glitter Effect */
        #glitter-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1; pointer-events: none;
            mix-blend-mode: screen;
        }

        /* === CUSTOM CURSOR === */
        .cursor-dot, .cursor-outline {
            position: fixed; top: 0; left: 0; transform: translate(-50%, -50%);
            border-radius: 50%; z-index: 9999; pointer-events: none;
        }

        .cursor-dot { width: 6px; height: 6px; background-color: var(--accent); box-shadow: 0 0 10px var(--accent); }
        .cursor-outline { width: 40px; height: 40px; border: 1px solid var(--accent); transition: width 0.2s, height 0.2s, background-color 0.2s; }

        /* === WELCOME SCREEN === */
        .welcome-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(3, 5, 10, 0.98); backdrop-filter: blur(20px);
            z-index: 50; display: flex; align-items: center; justify-content: center;
            flex-direction: column; overflow: hidden;
        }

        .welcome-text {
            font-family: 'Anton', sans-serif; font-size: clamp(3rem, 10vw, 8rem);
            color: var(--text); text-align: center; line-height: 1; z-index: 10; text-transform: uppercase;
        }

        .welcome-text span {
            color: var(--accent);
            text-shadow: 0 0 30px rgba(0, 229, 255, 0.5);
            -webkit-text-stroke: 0;
        }

        .float-icon {
            position: absolute; font-size: clamp(3rem, 5vw, 6rem);
            z-index: 5; filter: drop-shadow(0 0 15px currentColor);
        }

        .scroll-spacer { position: relative; width: 100vw; height: 100vh; z-index: 2; }

        /* === HERO SECTION === */
        .hero {
            height: 100vh; width: 100vw; position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: transparent; overflow: hidden; z-index: 10;
        }

        .text-utkarsh {
            position: absolute; top: 15%; width: 100%; text-align: center;
            font-family: 'Anton', sans-serif; font-size: 22vw; line-height: 0.8;
            color: #ffffff; z-index: 1; text-transform: uppercase; letter-spacing: -2px;
        }

        .hero-image-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 320px; height: 480px; z-index: 2; border-radius: 12px;
            border: 2px solid var(--accent); box-shadow: 0 0 50px rgba(0, 229, 255, 0.4), inset 0 0 20px rgba(0, 229, 255, 0.2);
            overflow: visible; display: flex; align-items: flex-end; justify-content: center; background: transparent;
        }

        .hero-image-box img.holographic-cutout {
            position: absolute; bottom: 0; left: 50%; width: 140%; height: auto;
            object-fit: cover; z-index: 5; transform: translateX(-50%); 
            filter: drop-shadow(0 -10px 25px rgba(0, 229, 255, 0.4)) contrast(1.1) brightness(0.95);
        }

        .text-shukla {
            position: absolute; bottom: 10%; width: 100%; text-align: center;
            font-family: 'Anton', sans-serif; font-size: 22vw; line-height: 0.8;
            color: var(--accent); z-index: 3; text-transform: uppercase; letter-spacing: -2px;
            text-shadow: 0 10px 40px rgba(0, 229, 255, 0.4);
            background: linear-gradient(180deg, #00ffff 0%, #0088ff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

            position: absolute; bottom: 25%; z-index: 10; background: var(--accent); color: #000;
