    <style>
        /* === BASE & RESET === */
        :root {
            --bg: #03050a; 
            --text: #f0f0f0;
            --accent: #00e5ff; /* Cyan Blue */
            --glass: rgba(0, 229, 255, 0.03);
            --border: rgba(0, 229, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        ::selection { background: var(--accent); color: #000; }

        /* Disable ugly blue highlighting on massive text elements */
        .welcome-text, .text-utkarsh, .text-shukla, .hero-subtitle-badge, .float-icon {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        /* Cinematic Noise Overlay */
        .noise-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 9998; opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Dynamic Canvas Smoke Effect */
        #smoke-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0; pointer-events: none; opacity: 0.5;
        }

        /* 🚀 NEW: INTERACTIVE WATER-WAVE & GLITTER CANVAS 🚀 */
        #glitter-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1; pointer-events: none;
            mix-blend-mode: screen;
        }

        /* === CUSTOM CURSOR === */
        .cursor-dot, .cursor-outline {
            position: fixed; top: 0; left: 0; transform: translate(-50%, -50%);
            border-radius: 50%; z-index: 9999; pointer-events: none;
        }

        .cursor-dot { width: 6px; height: 6px; background-color: var(--accent); box-shadow: 0 0 10px var(--accent); }
        .cursor-outline { width: 40px; height: 40px; border: 1px solid var(--accent); transition: width 0.2s, height 0.2s, background-color 0.2s; }

        /* === PRELOADER === */
        .preloader {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Anton', sans-serif; font-size: 6rem; color: var(--accent);
            user-select: none;
        }
